    <title>Assay — was I paid the correct amount?</title>
    <meta
      name="description"
      content="Assay independently verifies payment-gateway settlements: it decomposes every bank credit into the transactions that produced it, recomputes each deduction from the contracted rate card, and reports in rupees anything that cannot be explained."
    />
    <meta name="theme-color" content="#08090b" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />

    />

    <!-- Two typefaces, and no more: Inter for display, JetBrains Mono for
         every number on the page. Preconnected so the first paint is not
         waiting on a DNS round trip, and `display=swap` so it never blocks
         at all. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
