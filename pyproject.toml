[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assay"
version = "0.1.0"
description = "Independently verifies payment-gateway settlements, line by line, in rupees."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Anshumaan1254", email = "singhub1267@gmail.com" }]
dependencies = [
    "pydantic>=2",
    "typer",
    "structlog",
    "sqlmodel",
    "google-genai",
    "python-dotenv",
    "pyyaml",
    # core/decompose.py tier 3 only: scipy.optimize.linear_sum_assignment.
    # numpy is declared explicitly because decompose imports it directly to
    # build an int64 cost matrix, rather than relying on it transitively.
    "numpy",
    "scipy",
    # eval/calibrate_lanes.py only: sklearn.isotonic.IsotonicRegression to
    # fit lane calibration curves, and scipy.stats.beta for the
    # Clopper-Pearson bound behind the AUTO-lane coverage guarantee. Never
    # imported from core/ or llm/ -- fitting is eval/'s job alone.
    "scikit-learn",
    # eval/diagram.py only, and optional even there: EVIDENCE.md embeds a
    # hand-built, byte-deterministic SVG of the reliability diagram, and
    # matplotlib additionally renders the same numbers as a PNG for
    # contexts that will not display SVG. write_png() returns None rather
    # than raising if it is absent, so a missing renderer can never fail a
    # `make evidence` run. Never imported from core/ or llm/.
    "matplotlib",
]

[project.scripts]
assay = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "hypothesis",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "llm", "datagen", "eval", "chaos", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
