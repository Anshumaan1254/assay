[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assay"
version = "0.1.0"
description = "Independently verifies payment-gateway settlements, line by line, in rupees."
readme = "README.md"
license = { text = "MIT" }
# 3.12 is permitted for one reason: Vercel's Python runtime does not
# offer 3.11 and forces 3.12, and `uv lock` refuses to resolve against a
# `==3.11.*` requirement. Development, CI and the test suite still run
# 3.11 -- treat 3.12 as "the deployed reviewer runs here", not as a
# tested target. No stdlib module removed in 3.12 is used anywhere.
requires-python = ">=3.11,<3.13"
authors = [{ name = "Anshumaan1254", email = "singhub1267@gmail.com" }]
dependencies = [
    "pydantic>=2",
    "typer",
    "structlog",
    "sqlmodel",
    "google-genai",
    "python-dotenv",
    "pyyaml",
    # ingest/razorpay.py only: the gateway REST client. Declared
    # explicitly rather than relied on transitively through google-genai,
    # which happens to vendor it today but makes no promise to tomorrow.
    # Never imported from core/.
    "httpx",
    # core/decompose.py tier 3 only: scipy.optimize.linear_sum_assignment.
    # numpy is declared explicitly because decompose imports it directly to
    # build an int64 cost matrix, rather than relying on it transitively.
    "numpy",
    "scipy",
    # eval/calibrate_lanes.py only: sklearn.isotonic.IsotonicRegression to
    # fit lane calibration curves, and scipy.stats.beta for the
    # Clopper-Pearson bound behind the AUTO-lane coverage guarantee. Never
    # imported from core/ or llm/ -- fitting is eval/'s job alone.
    "scikit-learn",
    # eval/diagram.py only, and optional even there: EVIDENCE.md embeds a
    # hand-built, byte-deterministic SVG of the reliability diagram, and
    # matplotlib additionally renders the same numbers as a PNG for
    # contexts that will not display SVG. write_png() returns None rather
    # than raising if it is absent, so a missing renderer can never fail a
    # `make evidence` run. Never imported from core/ or llm/.
    "matplotlib",
]

[project.scripts]
assay = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "hypothesis",
    # Pinned, not floating. ruff's default rule set is a curated list that
    # changes between releases: 0.16 checks B008/I001/SIM102/RUF059/PLW1510,
    # earlier ones did not. An unpinned `ruff` therefore makes `make lint`
    # mean something different on a developer's machine than in CI, and
    # change under people without a commit. Determinism applies to the
    # toolchain too. Bump deliberately, with the resulting fixes in the
    # same commit.
    "ruff==0.16.4",
    # reviewer/ only. In dev rather than the base install: the CLI is the
    # product and must stay installable without a web stack. httpx (already
    # a base dependency for ingest/) doubles as fastapi's TestClient.
    "fastapi",
    "uvicorn",
]
ui = [
    "fastapi",
    "uvicorn",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "llm", "datagen", "eval", "chaos", "cli", "store", "ingest", "reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
# tests/fixtures/ holds files that exist to BE violations -- core/ modules
# importing llm/, dividing Money, mixing in floats. tests/test_guard.py runs
# scripts/guard_core.py against them and asserts it flags every one. Linting
# them is a category error, and it is what made `make lint` and `make guard`
# both exit 1 on a clean checkout.
extend-exclude = ["tests/fixtures"]

# ── Vercel: the reviewer deployment ──────────────────────────────────────
# Vercel's Python runtime auto-detects a FastAPI `app` only in files named
# app/index/server/main/wsgi/asgi at the root or in src//app//api/. This repo
# has none of those -- the app lives at reviewer/api.py -- so the entrypoint
# is declared here, which is exactly what the "No FastAPI entrypoint found"
# build error asks for.
#
# It points at the shim, not at api.py: reviewer/vercel_app.py stages the
# audit store somewhere writable before importing the real app. See that
# module and scripts/vercel_reviewer_build.py.
#
# vercel.json's buildCommand takes precedence over the script below; both are
# set so either entry point into the build behaves identically.
[tool.vercel]
entrypoint = "reviewer.vercel_app:app"

[tool.vercel.scripts]
build = "python scripts/vercel_reviewer_build.py"
