# Every claim this repository makes, as a gate.
#
# NO SECRETS. Not "no secrets yet" -- the engine is built so that it cannot
# need one: `.llm_cache/` is committed, CachedProvider serves every prompt
# from it, and GeminiProvider resolves its API key lazily inside
# generate_structured() so a key-less machine never even constructs a
# client. If a job here ever needs `secrets.*`, that is a design regression
# to fix in the engine, not a secret to add to this file.
#
# Jobs are separate on purpose, so each gets a clean checkout. That is not
# tidiness: tests/test_site.py::test_baked_data_is_not_stale is skipped when
# runs/realistic-seed42/report.json is absent and ACTIVE when it is not, and
# it compares against a hash baked on Windows. Any job that ran an audit
# before pytest would fail it for reasons unrelated to the change under test.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Makefile defaults PYTHON to a developer's Conda path via `?=`, which
  # defers to the environment. This is what makes `make` usable here.
  PYTHON: python

jobs:
  lint-and-test:
    name: lint, guard, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.11 deliberately. pyproject.toml permits <3.13 only because
          # Vercel's runtime forces 3.12 on the deployed reviewer.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install

      - name: Lint
        run: make lint

      # guard_core.py over every tracked .py under a core/ directory, then
      # check_evidence.py, which fails if EVIDENCE.md was hand-edited. Needs
      # a real checkout: the file list comes from `git ls-files`, and in a
      # .git-less tree it expands to nothing and passes falsely.
      - name: Guard core/ invariants
        run: make guard

      # No audit runs in this job. See the file header.
      - name: Test suite
        run: make test

  chaos:
    name: chaos 18/18
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install

      # C01 and C02 hard-reference runs/clean-seed42 with no skip guard, and
      # only runs/realistic-seed42 is committed. --truth-out is redirected
      # because the default, truth/ground_truth.json, is a tracked file this
      # would otherwise overwrite.
      - name: Generate the clean-profile run the scenarios need
        run: assay generate --profile clean --seed 42 --truth-out truth/ci-clean-seed42.json

      # `assay chaos`, not `make chaos`: cli/chaos.py runs the incident
      # reporter unconditionally, so a failure still prints the table naming
      # WHICH scenario failed. Make's per-line semantics abort at the failing
      # pytest line and swallow exactly the artifact you need.
      - name: Every failure-injection scenario
        run: assay chaos

  clean-profile:
    name: clean profile reconciles to zero
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install

      # `assay audit` takes a run directory, not a profile name: resolving a
      # profile would mean cli/ importing datagen/, which invariant 5 forbids
      # and tests/test_architecture.py asserts against. So the profile is
      # materialised first, then audited by path.
      - name: Generate, compile, audit
        run: |
          assay generate --profile clean --seed 42 --truth-out truth/ci-clean-seed42.json
          assay contract compile runs/clean-seed42/rate_card.md
          assay audit --run-dir runs/clean-seed42

      # `assay audit` exits 0 even with rupees missing -- exit 1 is reserved
      # for refusals -- so the gate is a separate assertion on the report.
      - name: A zero-discrepancy month must reconcile to exactly zero
        run: python scripts/ci_checks.py reconciled runs/clean-seed42/report.json

  determinism:
    name: determinism
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install

      # Relative --run-dir, never absolute: run_dir is inside the report's
      # hash payload, so an absolute path makes report_hash a function of
      # where the repository was checked out. That reached production once
      # already -- DECISIONS.md 2026-08-30 00:20.
      - name: Audit once
        run: |
          assay contract compile runs/realistic-seed42/rate_card.md
          assay audit --run-dir runs/realistic-seed42
          R=runs/realistic-seed42/report.json
          python scripts/ci_checks.py field $R report_hash  > hash1.txt
          python scripts/ci_checks.py field $R audit_run_id > run_id.txt
          echo "run 1: $(cat hash1.txt)"

      # A second audit against the SAME store would resume from the durable
      # checkpoint store/resumable.py keys off audit_run_id, and compare a
      # hash to itself. A fresh database forces a real recompute.
      - name: Audit again from a fresh store, and compare
        env:
          ASSAY_STORE_PATH: .assay/ci-second-run.db
        run: |
          assay audit --run-dir runs/realistic-seed42
          python scripts/ci_checks.py field runs/realistic-seed42/report.json report_hash > hash2.txt
          echo "run 1: $(cat hash1.txt)"
          echo "run 2: $(cat hash2.txt)"
          cmp hash1.txt hash2.txt \
            || { echo "FAIL: two audits of identical inputs produced different report hashes"; exit 1; }
          echo "OK: byte-identical report_hash across two independent runs"

      # The purpose-built invariant-4 tool: re-runs the audit from its
      # recorded run_dir and exits 1 if the hash does not reproduce.
      - name: Replay it
        run: assay replay "$(cat run_id.txt)"

  evidence:
    name: evidence is real
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install

      # check_evidence.py proves EVIDENCE.md was not hand-edited. It cannot
      # prove the document is still true -- one generated twenty commits ago
      # passes untouched. The regeneration below is the other half.
      - name: EVIDENCE.md was not hand-edited
        run: python scripts/check_evidence.py

      - name: Regenerate it from a real sweep
        run: make evidence

      # Compares every measured number, masking only rows that describe the
      # machine, the clock or the checkout. See the script's own docstring.
      - name: The committed evidence must reproduce
        run: python scripts/evidence_diff.py

  docker:
    name: docker, offline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t assay .

      # The claim under test: no environment variables, no network, and the
      # complete audit still comes out -- every model response served from
      # the committed .llm_cache/. --network none is the proof.
      - name: Full audit with no network and no API key
        run: docker run --rm --network none assay demo

      - name: Image must stay under 500 MB
        run: python scripts/ci_checks.py image-size assay --budget-mb 500
