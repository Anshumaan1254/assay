<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="presentation">
  <!--
    Decorative only. Carries no data and encodes no audit result — it exists
    to give the scroll gate something to open onto. Deliberately abstract so
    it cannot be mistaken for a chart: nothing here is measured, and the one
    place this page shows real numbers is everywhere below it.

    Hand-authored rather than generated: no image model is wired up in this
    environment. Swap this file for any image you like — the hero takes a
    plain src, so dropping a PNG/JPG in public/ and pointing at it is enough.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="55%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>

    <radialGradient id="bloomGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8b44a" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#c98f2e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e8b44a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bloomBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ba9ff" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#3f6ecb" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6ba9ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bloomViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9b6bff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8b44a" stop-opacity="0"/>
      <stop offset="30%" stop-color="#e8b44a" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#ffd98a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8b44a" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ba9ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#6ba9ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6ba9ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ribbonC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- atmospheric blooms -->
  <g filter="url(#softer)">
    <ellipse cx="330" cy="250" rx="440" ry="300" fill="url(#bloomGold)"/>
    <ellipse cx="1290" cy="640" rx="470" ry="330" fill="url(#bloomBlue)"/>
    <ellipse cx="880" cy="120" rx="360" ry="220" fill="url(#bloomViolet)"/>
  </g>

  <!-- flowing ribbons -->
  <g fill="none" filter="url(#soft)" opacity="0.85">
    <path d="M-80 620 C 260 520, 420 720, 760 600 S 1240 400, 1700 520"
          stroke="url(#ribbonA)" stroke-width="2.5"/>
    <path d="M-80 680 C 300 600, 500 780, 820 660 S 1280 470, 1700 590"
          stroke="url(#ribbonA)" stroke-width="1.2" opacity="0.6"/>
    <path d="M-80 430 C 300 330, 560 500, 900 380 S 1320 210, 1700 320"
          stroke="url(#ribbonB)" stroke-width="2"/>
    <path d="M-80 760 C 340 700, 620 840, 980 740 S 1380 620, 1700 700"
          stroke="url(#ribbonC)" stroke-width="1.6"/>
  </g>

  <!-- crisp overlay strokes, unblurred, for definition -->
  <g fill="none" opacity="0.5">
    <path d="M-80 620 C 260 520, 420 720, 760 600 S 1240 400, 1700 520"
          stroke="url(#ribbonA)" stroke-width="1"/>
    <path d="M-80 430 C 300 330, 560 500, 900 380 S 1320 210, 1700 320"
          stroke="url(#ribbonB)" stroke-width="0.8"/>
  </g>

  <!-- sparse motes -->
  <g fill="#e8b44a" opacity="0.5">
    <circle cx="412" cy="576" r="2.2"/>
    <circle cx="905" cy="381" r="1.8"/>
    <circle cx="1288" cy="470" r="2.6"/>
    <circle cx="240" cy="392" r="1.4"/>
    <circle cx="1520" cy="318" r="1.6"/>
  </g>
  <g fill="#6ba9ff" opacity="0.45">
    <circle cx="660" cy="455" r="1.6"/>
    <circle cx="1120" cy="286" r="2"/>
    <circle cx="820" cy="700" r="1.5"/>
  </g>

  <rect width="1600" height="900" fill="url(#vignette)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
