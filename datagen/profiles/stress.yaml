# Dense counts, bounded by the natural eligible population a 5,200-
# payment / 0.15%-chargeback month actually produces -- inject.py raises
# InjectionProfileError rather than silently under-delivering if a count
# here exceeds what's available. D03 (cap-not-applied, debit-only,
# gross above ~Rs.11,400 where the Rs.70 cap actually binds) and D05
# (won-chargeback reversal) have genuinely thin, seed-variable natural
# pools -- empirically as low as 2 and 1 respectively across seeds 1-20
# (see DECISIONS.md) -- so they stay at the same safe floor as
# realistic.yaml rather than "dense" like every other class here; pushing
# them higher would make this profile fail on a meaningful fraction of
# seeds instead of just being sparse. Even at this floor, D05 can still
# occasionally hit a seed with zero won chargebacks (~2% of seeds tested)
# -- a real property of a ~0.15% chargeback rate over one month, surfaced
# as an explicit InjectionProfileError, not silently under-delivered.
# Seed 42 is confirmed clean for both classes.
D01: 20
D02: 15
D03: 2
D04: 15
D05: 1
D06: 15
D07: 8
D08: 15
D09: 15
D10: 15
D11: 15
D12: 15
